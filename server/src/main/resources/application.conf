ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
    }
    application {
        modules = [ mx.edu.upchiapas.adelitagoat.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/adelitagoat"
    url = ${?DB_URL}
    user = "adelita_dev"
    user = ${?DB_USER}
    password = "adelita_local_dev_only"
    password = ${?DB_PASSWORD}
    driver = "org.postgresql.Driver"
    driver = ${?DB_DRIVER}
    allowEmbeddedFallback = true
    allowEmbeddedFallback = ${?DB_ALLOW_EMBEDDED_FALLBACK}
    seedDemoData = false
    seedDemoData = ${?SEED_DEMO_DATA}
    maxPoolSize = 4
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
}
